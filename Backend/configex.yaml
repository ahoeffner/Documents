server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

database:
  url: jdbc:postgresql://home:5432/private
  username: uid
  password: pwd
  minimum-idle: 1
  maximum-pool-size: 3

app:
  gemini:
    api-key: YOUR_API_KEY_HERE
    prompts-file: ./prompts.yaml
    llm-model: gemini-2.5-flash-lite
    fallback-model: gemini-2.5-flash
    embedding-model: models/gemini-embedding-001
    timeout-seconds: 300
    embedding-retries: 3
    max-conversations: 64

  # Home tab: Home Assistant MCP server (Settings → Devices & services → Model Context Protocol Server)
  # In Docker, Home Assistant runs with network_mode: host, so reach it via the host gateway;
  # docker-compose.yaml needs:  extra_hosts: ["host.docker.internal:host-gateway"]
  # Outside Docker use e.g. http://home:8123/api/mcp
  homeassistant:
    url: http://host.docker.internal:8123/api/mcp
    token: YOUR_LONG_LIVED_ACCESS_TOKEN   # HA profile → Security → Long-lived access tokens
    timeout-seconds: 60
    max-steps: 10                         # max tool calls per question

  i18n:
    path: ./lang

  hosts:
    localhost: documents
    home.hoeffner.net: documents
    private.hoeffner.net: documents
    slotsdalen.hoeffner.net: slotsdalen

  # optional app name per host (installed app name, short name and window title);
  # hosts not listed get "<Subdomain> AI Documents"
  names:
    home.hoeffner.net: Butler

  tesseract:
    pdf-dpi: 300
    language: dan

  chunker:
    max-tokens: 4096
    overlap-size: 64

  vector-search:
    boundary:
      - 0.1
      - 0.6

logging:
  level:
    ai.dochandler: INFO
